name: 'Crypto'        # 👈 IMPORTANT: must match what dbt shows in logs
version: '1.0.0'
config-version: 2

profile: 'default'    # or 'user' depending on dbt Cloud, keep as is if it works

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  Crypto:              # 👈 must match `name` above and what logs show
    # default for all models
    +materialized: view

    staging:
      +schema: crypto_staging
      +materialized: view

    combined:
      +schema: crypto_marts
      +materialized: view   # or table if you prefer

    analysis:
      +schema: crypto_marts
      +materialized: view   # we can switch to table later for marts