name: 'Crypto'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  Crypto:
    # default for all models (optional)
    +materialized: view

    staging:
      +schema: crypto_staging
      +materialized: view

    combined:
      +schema: crypto_marts
      +materialized: table

    analysis:
      +schema: crypto_marts
      +materialized: table
